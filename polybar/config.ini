[colors]
background = #17172E
background-alt = #29294A
foreground = #E0E7FF
foreground-alt = #A5B4FC
indigo = #A5B4FC
indigo-dark = #17172E

light-indigo = #dee4fa


white = #EEF2FF
urgent = #F87191

[bar/main]
bottom = true
width = 100%
height = 30
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.light-indigo}

border-size = 0

padding-left = 0
padding-right = 1

module-margin = 1

font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2

modules-left =  launcher xworkspaces taskbar 
modules-center =  xwindow  
modules-right = clipboard network cpu memory ethernet pulseaudio date power

 
separator = "|"
separator-foreground = ${colors.light-indigo}

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = generic
override-redirect = false


[module/taskbar]
type = custom/script
exec = ~/.config/polybar/scripts/taskbar.sh
interval = 1
format = <label>
label = %output%
label-font = 2

; =========================================================
; ROFI / LAUNCHER
; =========================================================

[module/launcher]
type = custom/text

content = " "
content-foreground = ${colors.light-indigo}
content-background = ${colors.background}
content-font = 1

click-left = rofi -show drun


; =========================================================
; PROGRAMAS ABERTOS
; =========================================================

[module/xworkspaces]
type = internal/xworkspaces

enable-click = true
enable-scroll = true
pin-workspaces = true

label-active = %name%
label-active-foreground = ${colors.light-indigo}
label-active-background = ${colors.background-alt}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

label-empty =
; =========================================================
; JANELA ATIVA
; =========================================================

[module/xwindow]
type = internal/xwindow
;label = %{A1:wmctrl -k on:}%{A3:wmctrl -k on:}%title:0:60%%{A}%{A}
label = %{A1:~/.config/polybar/scripts/desktop-toggle.sh show:}%{A3:~/.config/polybar/scripts/desktop-toggle.sh restore:}%title:0:60%%{A}%{A}

label-foreground = ${colors.foreground}

label-empty =

click-left = wmctrl -k on
click-right = wmctrl -k on

; =========================================================
; DESKTOP / WORKSPACE
; =========================================================

[module/desktop]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = ${colors.light-indigo}
label-active-background = ${colors.background-alt}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = #65705B
label-empty-padding = 1

; =========================================================
; DOWNLOAD / UPLOAD
; =========================================================

[module/network]
type = custom/script

exec = ~/.config/polybar/scripts/network.sh
interval = 1

format = <label>

label = %output%


; =========================================================
; TEMPERATURA
; =========================================================

[module/temperature]
type = custom/script

exec = ~/.config/polybar/scripts/temperature.sh
interval = 3

format = <label>

label = %output%


; =========================================================
; CPU
; =========================================================

[module/cpu]
type = custom/script

exec = ~/.config/polybar/scripts/cpu_temp.sh
interval = 2

format = <label>
label = %output%
; =========================================================
; MEMÓRIA
; =========================================================

[module/memory]
type = internal/memory

interval = 2

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.light-indigo}

label = %percentage_used%%


; =========================================================
; CLIPBOARD
; =========================================================

[module/clipboard]
type = custom/text

content = "  "
content-foreground = ${colors.light-indigo}

click-left = ~/.config/polybar/scripts/clipboard.sh


; =========================================================
; ETHERNET
; =========================================================

[module/ethernet]
type = internal/network
interface = enp4s0
interface-type = wired
interval = 2
format-connected = <label-connected>
format-connected-foreground = ${colors.light-indigo}
label-connected = "%{A1:nm-connection-editor:}%{A3:nm-connection-editor:}󰈀 %local_ip%%{A}%{A}"
format-disconnected = <label-disconnected>
label-disconnected = "%{A1:nm-connection-editor:}%{A3:nm-connection-editor:}󰈀 desconectado%{A}%{A}"
click-left =
click-right =

; =========================================================
; VOLUME
; =========================================================

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.light-indigo}

label-volume = %percentage%%

format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.light-indigo}

label-muted = muted
click-right = pavucontrol

; =========================================================
; HORA
; =========================================================

[module/date]

type = internal/date
interval = 1
time = %H:%M:%S
label = "%{A1:orage:}%{A3:orage:}%time%%{A}%{A}"
label-foreground = ${colors.foreground}

; =========================================================
; DESLIGAR / REINICIAR / SUSPENDER
; =========================================================

[module/power]
type = custom/text

content = " ⏻ "
content-foreground = ${colors.light-indigo}

click-left = ~/.config/polybar/scripts/power.sh


; =========================================================
; SENSORES
; =========================================================

[module/sensors]
type = custom/script

exec = ~/.config/polybar/scripts/temperature.sh
interval = 3
