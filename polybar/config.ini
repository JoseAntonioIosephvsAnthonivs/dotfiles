[colors]
background = #243020
background-alt = #30402A
foreground = #D8E8C0
foreground-alt = #A8C686
green = #A8C686
green-dark = #243020
green-light = #C5E1A5
white = #E8F0DC
urgent = #E06C75

[bar/main]
width = 100%
height = 30
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.green-light}

border-size = 0

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2


;modules-left = launcher xworkspaces
modules-left = launcher xwindow 

modules-center = 
;modules-center = xwindow

;modules-right = network temperature cpu memory clipboard ethernet pulseaudio date power
modules-right = desktop network temperature cpu memory clipboard ethernet pulseaudio date power

separator = "  "
separator-foreground = ${colors.green-light}

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = generic
override-redirect = false


; =========================================================
; ROFI / LAUNCHER
; =========================================================

[module/launcher]
type = custom/text

content = "  "
content-foreground = ${colors.green-light}
content-background = ${colors.background}
content-font = 1

click-left = rofi -show drun


; =========================================================
; PROGRAMAS ABERTOS
; =========================================================

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = ${colors.green-light}
label-active-background = ${colors.background-alt}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = #65705B
label-empty-padding = 1


; =========================================================
; JANELA ATIVA
; =========================================================

[module/xwindow]
type = internal/xwindow

label = %title:0:80%
label-foreground = ${colors.foreground}

label-empty =


; =========================================================
; DESKTOP / WORKSPACE
; =========================================================

[module/desktop]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = ${colors.green-light}
label-active-background = ${colors.background-alt}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = #65705B
label-empty-padding = 1

; =========================================================
; DOWNLOAD / UPLOAD
; =========================================================

[module/network]
type = custom/script

exec = ~/.config/polybar/scripts/network.sh
interval = 1

format = <label>

label = %output%


; =========================================================
; TEMPERATURA
; =========================================================

[module/temperature]
type = custom/script

exec = ~/.config/polybar/scripts/temperature.sh
interval = 3

format = <label>

label = %output%


; =========================================================
; CPU
; =========================================================

[module/cpu]
type = internal/cpu

interval = 2

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.green-light}

label = %percentage%%


; =========================================================
; MEMÓRIA
; =========================================================

[module/memory]
type = internal/memory

interval = 2

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.green-light}

label = %percentage_used%%


; =========================================================
; CLIPBOARD
; =========================================================

[module/clipboard]
type = custom/text

content = "  "
content-foreground = ${colors.green-light}

click-left = ~/.config/polybar/scripts/clipboard.sh


; =========================================================
; ETHERNET
; =========================================================

[module/ethernet]
type = internal/network

interface = enp4s0
interface-type = wired

interval = 2

format-connected = <label-connected>

label-connected = "󰈀 %local_ip%"

label-connected-foreground = ${colors.foreground}


; =========================================================
; VOLUME
; =========================================================

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.green-light}

label-volume = %percentage%%

format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.green-light}

label-muted = muted


; =========================================================
; HORA
; =========================================================

[module/date]
type = internal/date

interval = 1

date = %d/%m/%Y
time = %H:%M:%S

label = "󰥔 %date%  %time%"
label-foreground = ${colors.foreground}


; =========================================================
; DESLIGAR / REINICIAR / SUSPENDER
; =========================================================

[module/power]
type = custom/text

content = " ⏻ "
content-foreground = ${colors.green-light}

click-left = ~/.config/polybar/scripts/power.sh


; =========================================================
; SENSORES
; =========================================================

[module/sensors]
type = custom/script

exec = ~/.config/polybar/scripts/temperature.sh
interval = 3
